version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobspark_db
    environment:
      POSTGRES_USER: jobspark
      POSTGRES_PASSWORD: jobspark123
      POSTGRES_DB: jobspark_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jobspark_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
