# Build da imagem do frontend passando a URL da API em build time.
# Uso: gcloud builds submit --config cloudbuild.yaml \
#        --substitutions=_API_URL=https://...,_APP_URL=https://...,_IMAGE=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
